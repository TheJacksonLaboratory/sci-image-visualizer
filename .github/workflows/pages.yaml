# Builds the browser example (examples/browser-image) and the user guide
# (docs/user-guide, mkdocs) and publishes both to GitHub Pages:
#   https://thejacksonlaboratory.github.io/sci-image-visualizer/        the demo
#   https://thejacksonlaboratory.github.io/sci-image-visualizer/docs/   the guide
# The toolbar's Help button links to the guide (SIV_DOCS_URL), so its URL must not move.
#
# Requires: Settings → Pages → Source = "GitHub Actions". For an internal/private
# repo, Pages is only served with GitHub Enterprise Cloud (access-controlled);
# otherwise it publishes once the repo is public.
name: Deploy example to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/browser-image/**'
      - 'src/**'
      - 'docs/user-guide/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public Pages serves under /sci-image-visualizer/ — Vite must build with this
      # base or every absolute /assets URL 404s at the subpath (white page). The
      # smoke test reads it too, to preview + probe at the same subpath.
      PAGES_BASE: /sci-image-visualizer/
      # Live tiled (Mode A) server on the dev cluster (public split-Ingress).
      VITE_TILE_SERVER: https://imagetools-dev.jax.org/tiles-api/
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # pull the real sample-image bytes, not LFS pointers
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # ng-packagr → ./dist (the example aliases to it)
      - run: npm run build:example
      - run: npx playwright install --with-deps chromium
      - run: node examples/browser-image/smoke.mjs # fails on any runtime error / white page
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/user-guide/requirements.txt
      - run: pip install -r docs/user-guide/requirements.txt
      # The guide is served under the demo, at <pages>/docs/.
      - run: mkdocs build --strict -f docs/user-guide/mkdocs.yml -d "$GITHUB_WORKSPACE/examples/browser-image/dist/docs"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/browser-image/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
