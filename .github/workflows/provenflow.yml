name: ProvenFlow review

# Model-checks the code a pull request changes (state machines, resource lifecycles such as
# subscriptions and timers, design-pattern contracts) and runs Semgrep, then reviews the pull
# request: findings on the changed lines, verified fixes as one-click suggestions.
# https://github.com/belkassaby/provenflow/blob/v0.1.0/docs/code-model-checking.md#the-github-action
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: ProvenFlow review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base of the pull request, for the diff
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # The dependencies give the type checker the Angular and RxJS types, and proposed fixes are
      # type-checked with npm run typecheck before they are marked verified.
      - name: Install dependencies
        run: npm ci
      - uses: belkassaby/provenflow@v0
        with:
          fail-on: none # comments only; set to error to fail the check on errors
