<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 512 512">
  <!-- Spatial omics: observations (spots / cells) positioned within a tissue
       section, their SIZE varying with the value they carry — what this plot
       mode actually draws.

       Sized for a 16px toolbar icon, which drives every choice here:
        - Solid fills and one thick outline. The toolbar tints icons with
          `filter: brightness(0) …`, which flattens every colour to black, so a
          white highlight inside a dark shape simply disappears — shape has to
          carry the meaning, never tone.
        - Ink at ~6-18% of the viewBox (outline 34/512, dots r=30-46). Thin
          strokes render sub-pixel at 16px, antialias to ~20-40% alpha, and the
          recolour filter then washes them out to an illegible smudge. That is
          what made the previous version (6/512 and 12/512 strokes) invisible.
        - No low-opacity decoration: it is invisible at 16px either way.

       NOTE: cells.svg — the cellpose button in this same toolbar — is also a
       framed dot cluster. These two are deliberately kept apart by the dots
       here being few, round and strongly graded in size, against cells.svg's
       many uniform blobs. -->
  <rect x="52" y="52" width="408" height="408" rx="72"
        fill="none" stroke="#000000" stroke-width="34"/>
  <circle cx="170" cy="176" r="46" fill="#000000"/>
  <circle cx="330" cy="164" r="30" fill="#000000"/>
  <circle cx="256" cy="270" r="38" fill="#000000"/>
  <circle cx="160" cy="340" r="30" fill="#000000"/>
  <circle cx="344" cy="330" r="46" fill="#000000"/>
</svg>
