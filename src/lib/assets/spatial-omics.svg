<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 512 512">
  <!-- Spatial omics: an array of observations (spots / cells) whose SIZE varies
       with the value they carry — the thing this plot mode draws.
       Deliberately frameless, so it does not read as cells.svg (the cellpose
       button, a framed dot cluster) sitting in the same toolbar.

       Sized for a 16px toolbar icon, which drives every choice:
        - Solid fills only. The toolbar tints icons with
          `filter: brightness(0) …`, which flattens every colour to black — a
          white highlight inside a dark shape simply disappears, so shape has to
          carry the meaning, not tone.
        - Ink at ~7-13% of the viewBox. Thin strokes (the 6/512 and 12/512 of the
          previous version) render sub-pixel at 16px, antialias to ~20-40% alpha,
          and the recolour filter then washes them out to an illegible smudge.
        - No low-opacity decoration: invisible at 16px either way. -->
  <g fill="#000000">
    <circle cx="128" cy="128" r="34"/>
    <circle cx="256" cy="128" r="52"/>
    <circle cx="384" cy="128" r="40"/>
    <circle cx="128" cy="256" r="52"/>
    <circle cx="256" cy="256" r="68"/>
    <circle cx="384" cy="256" r="34"/>
    <circle cx="128" cy="384" r="40"/>
    <circle cx="256" cy="384" r="34"/>
    <circle cx="384" cy="384" r="52"/>
  </g>
</svg>
