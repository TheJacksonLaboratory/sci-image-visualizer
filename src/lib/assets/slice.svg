<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A volume (a cube) with a slab sliced off it by a scalpel: the slice editor. -->
  <defs>
    <mask id="slice-cut" maskUnits="userSpaceOnUse" x="-64" y="-64" width="192" height="192">
      <rect x="-64" y="-64" width="192" height="192" fill="#fff"/>
      <!-- The cube's lines stop short of the scalpel, so it reads at toolbar size. -->
      <path d="M30.9 16.5 Q23.6 26.5 25.4 40.1 L35.9 18.4 Z" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <path d="M34.4 16.2 L38.8 4.5 M33.9 17.6 L34.4 16.2" stroke="#000" stroke-width="9" stroke-linecap="round"/>
    </mask>
  </defs>
  <g transform="translate(7.58 -1.07) scale(1.0418)">
  <g fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" mask="url(#slice-cut)">
    <path d="M22.0 59.0 L30.3 54.2 L30.3 35.7 L14.3 26.4 L6.0 31.2 L6.0 49.8 Z M22.0 40.5 L22.0 59.0 M22.0 40.5 L30.3 35.7 M22.0 40.5 L6.0 31.2"/>
    <path d="M35.5 51.2 L40.9 48.1 L40.9 29.6 L24.9 20.3 L19.4 23.5 L19.4 42.0 Z M35.5 32.7 L35.5 51.2 M35.5 32.7 L40.9 29.6 M35.5 32.7 L19.4 23.5"/>
    <!-- The slab's cut face: the section the slice shows. -->
    <path d="M35.5 51.2 L35.5 32.7 L19.4 23.5 L19.4 42.0 Z" fill="#000"/>
  </g>
  <path d="M30.9 16.5 Q23.6 26.5 25.4 40.1 L35.9 18.4 Z" fill="#000"/>
  <path d="M34.4 16.2 L38.8 4.5" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <path d="M33.9 17.6 L34.4 16.2" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>

