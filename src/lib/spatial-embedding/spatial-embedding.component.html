<!-- Splitter on the INNER edge, so dragging it towards the canvas widens the panel.
     Docked only: a floating panel is moved and resized by its own window chrome. -->
<div class="se-splitter" *ngIf="!floating"
     (mousedown)="onSplitterDown($event)"
     (window:mousemove)="onSplitterMove($event)"
     (window:mouseup)="onSplitterUp()"
     title="Drag to resize"></div>

<div class="se-body">
  <div class="se-head">
    <span class="se-title">{{ active?.label ?? active?.name ?? 'Embedding' }}</span>

    <!-- Only offered when there is a choice to make. -->
    <p-dropdown *ngIf="options.length > 1"
                [options]="options" optionLabel="label" optionValue="name"
                [ngModel]="active?.name" (ngModelChange)="onEmbedding($event)"
                appendTo="body" styleClass="se-pick"></p-dropdown>

    <i class="pi pi-spin pi-spinner se-busy" *ngIf="busy" aria-label="loading"></i>
    <span class="se-spacer"></span>
    <p-button [icon]="floating ? 'pi pi-thumbtack' : 'pi pi-external-link'"
              size="small" [text]="true"
              [pTooltip]="floating ? 'Dock beside the viewer' : 'Detach into a window'"
              tooltipPosition="left"
              (onClick)="toggleFloating()"></p-button>
  </div>

  <div class="se-empty" *ngIf="!available">
    This dataset publishes no embedding. A host serves one by advertising it in the
    dataset manifest and implementing <code>getEmbedding()</code>.
  </div>

  <!-- Kept in the DOM whenever an embedding exists, so Plotly has a div to draw into. -->
  <div [id]="plotDiv" class="se-plot" *ngIf="available"></div>

  <small class="se-note" *ngIf="notice">{{ notice }}</small>
  <small class="se-note" *ngIf="!notice && available">{{ note }}</small>
</div>
