<p-toolbar>
  <div class="p-toolbar-group-start flex-wrap align-items-center gap-1">

    <!-- Host-provided custom toolbar buttons, shown first (e.g. app-specific
         actions the visualization view itself doesn't own). -->
    <ng-content></ng-content>

    <!-- Contributed dialog tools (TOOLBAR_TOOLS, kind: 'dialog'): app-level actions
         like the host's own buttons above, so they sit right beside them. Image view
         only, the view their dialog draws over. Highlighted while the dialog is open. -->
    <ng-container *ngIf="isImageView">
      <p-button *ngFor="let tool of dialogTools; trackBy: trackToolById"
                size="small" [text]="openDialogToolId !== tool.id"
                [pTooltip]="tool.tooltip" tooltipPosition="bottom"
                [ariaLabel]="tool.label"
                [attr.aria-pressed]="openDialogToolId === tool.id"
                (onClick)="toggleDialogTool.emit(tool.id)">
        <img *ngIf="tool.icon.src" [src]="tool.icon.src" style="width: 1rem" [alt]="tool.label"
             [class]="openDialogToolId === tool.id ? 'toolbar-icon-active' : 'toolbar-icon-dark'" />
        <i *ngIf="tool.icon.pi" class="pi {{ tool.icon.pi }}"></i>
      </p-button>
    </ng-container>

    <!-- Plot type: available for any image (grayscale or RGB), and for a spatial dataset
         that brings none (its spatial modes are still a choice). -->
    <ng-container *ngIf="showPlotTypes">
      <span class="toolbar-separator"></span>
      <p-dropdown [options]="plotTypeOptions" optionLabel="label" optionValue="type"
                  [ngModel]="selectedPlotType" appendTo="body"
                  pTooltip="Select plot type" tooltipPosition="bottom"
                  [style]="{'min-width': '11rem'}"
                  styleClass="plotmode-dropdown" panelStyleClass="plotmode-panel"
                  (onChange)="selectPlotType.emit($event.value)">
        <ng-template let-opt pTemplate="selectedItem">
          <span class="plotmode-item" *ngIf="opt">
            <i *ngIf="isPiIcon(opt.icon)" [class]="opt.icon"></i>
            <img *ngIf="opt.icon && !isPiIcon(opt.icon)" class="plotmode-icon-img" [src]="opt.icon" alt="" />
            <span>{{ opt.label }}</span>
          </span>
        </ng-template>
        <ng-template let-opt pTemplate="item">
          <span class="plotmode-item">
            <i *ngIf="isPiIcon(opt.icon)" [class]="opt.icon"></i>
            <img *ngIf="opt.icon && !isPiIcon(opt.icon)" class="plotmode-icon-img" [src]="opt.icon" alt="" />
            <span>{{ opt.label }}</span>
          </span>
        </ng-template>
      </p-dropdown>
      <ng-container *ngIf="isIsosurfaceMode">
        <span class="flex align-items-center mx-1 toolbar-text">Iso</span>
        <p-slider [ngModel]="isoRange" [range]="true"
                  [min]="isoValueMin" [max]="isoValueMax" [step]="isoValueStep"
                  (onChange)="isoRangeChange.emit($event.values)"
                  pTooltip="Isosurface band (0–255), mapped onto the volume's
                  actual intensity range. Surfaces are drawn for voxels whose
                  intensity falls in the selected band — narrow it to isolate
                  features, widen it to see the whole structure."
                  [escape]="false" tooltipPosition="bottom"
                  styleClass="wand-sensitivity-slider"></p-slider>
        <span class="flex align-items-center mx-1 toolbar-text wand-sensitivity-value">
          {{ isoRange[0] }}–{{ isoRange[1] }}</span>
      </ng-container>
      <!-- Intensity tools (Heatmap / Image mode): add another colored line ROI.
           Each added line gets the next bright palette colour and its own inset
           trace; select a line on the image and use the trash tool to remove it
           (and its trace). The lines are Region-based but excluded from the
           Region Editor and exports. -->
      <ng-container *ngIf="isIntensityCapable">
        <span class="toolbar-separator"></span>
        <p-button size="small" [text]="true"
                  pTooltip="Add an intensity line (new colour). Click a line to select it,
                  then use the trash tool to remove it."
                  [escape]="false" tooltipPosition="bottom"
                  (onClick)="addProfileLine.emit()">
          <img src="assets/plotting/spline-chart.svg" class="toolbar-icon-dark" style="width: 1rem"/>
        </p-button>
      </ng-container>
    </ng-container>
    <!-- Channels & Histogram: brightness/contrast, gamma, per-channel display,
         colormap/reverse/invert — opens the floating dialog. -->
    <p-button *ngIf="tools.specialTools" pRipple size="small" [text]="true"
              pTooltip="Channels &amp; Histogram (brightness/contrast, colormap)"
              tooltipPosition="bottom"
              (onClick)="openChannelHistogram.emit()">
      <img src="assets/plotting/invert.svg" class="toolbar-icon-dark" style="width: 1rem"/>
    </p-button>

    <!-- Spatial-omics controls. Only meaningful in the spatial mode, which is
         itself only offered while a dataset is loaded — so this button appears
         exactly when there is something for it to control. -->
    <p-button *ngIf="tools.specialTools && isSpatialMode" pRipple size="small" [text]="true"
              pTooltip="Spatial omics (colour by column or gene, legend, selection, distributions)"
              tooltipPosition="bottom"
              (onClick)="openSpatialControls.emit()">
      <img src="assets/plotting/spatial-omics.svg" class="toolbar-icon-dark" style="width: 1rem"/>
    </p-button>

    <!-- Smoothen toggle: bilinear smoothing vs nearest-neighbour raw pixels (Image
         view only — it's an OpenSeadragon drawer setting). Highlighted when smoothing on. -->
    <p-button *ngIf="tools.specialTools && isImageView" size="small"
              [text]="!imageSmoothingEnabled"
              pTooltip="Smoothen (turn on image smoothing)" tooltipPosition="bottom"
              (onClick)="toggleImageSmoothing.emit()">
      <img src="assets/plotting/smooth.svg" style="width: 1rem"
           [class]="imageSmoothingEnabled ? 'toolbar-icon-active' : 'toolbar-icon-dark'"/>
    </p-button>

    <!-- Stack controls -->
    <ng-container *ngIf="imageInfo?.isStack">
      <span class="toolbar-separator"></span>
      <!-- Image view: scrub z-slices live (the renderer swaps slices in place). -->
      <ng-container *ngIf="showsLiveSliceScrubber">
        <span class="flex align-items-center mx-1 toolbar-text">Slice</span>
        <p-slider [ngModel]="zIndex" [min]="0" [max]="maxIndex"
                  (onChange)="zScrub.emit($event.value)" (onSlideEnd)="zSlide.emit($event.value)"
                  pTooltip="Slice through the stack (← / → keys)" tooltipPosition="bottom"
                  [style]="{'width':'16rem'}" styleClass="wand-sensitivity-slider"></p-slider>
        <span class="flex align-items-center mx-1 toolbar-text">{{zIndex}} of {{maxIndex}}</span>
      </ng-container>
      <!-- Heatmap view: single-image (high-def zoom) vs stack (frame slider). Plotly-only —
           hidden for napari, which has no single/stack toggle or per-frame fetch, and for the
           spatial-omics modes: a 3D omics dataset publishes its reference volume as a z-stack
           image, and these modes draw observations, not one of its slices. -->
      <ng-container *ngIf="!showsLiveSliceScrubber && !isNapariMode && !isSpatialMode">
      <p-button icon="pi pi-image" size="small"
                [text]="imageInfo?.showStack"
                pTooltip="Single image mode: enables high-def zoom" tooltipPosition="bottom"
                (onClick)="selectStackOption.emit(stackOptions[0])">
      </p-button>
      <p-button icon="pi pi-images" size="small"
                [text]="!imageInfo?.showStack"
                pTooltip="Stack mode, enables slicing through image frames" tooltipPosition="bottom"
                (onClick)="selectStackOption.emit(stackOptions[1])">
      </p-button>
      <ng-container *ngIf="!imageInfo?.showStack">
        <span class="flex align-items-center mx-1 toolbar-text">Slice</span>
        <div class="p-inputgroup" style="width: auto">
          <p-inputNumber styleClass="w-3rem toolbar-input"
					pTooltip="View image in stack (&#x23CE;)"
					[ngModel]="zIndex" [min]="0" [max]="maxIndex"
           (onInput)="onSliceInput($event.value)" (keydown.enter)="reloadAndPlot.emit()"/>
          <p-button icon="pi pi-refresh" size="small" [text]="true" (onClick)="reloadAndPlot.emit()"
                    pTooltip="Plot this slice" tooltipPosition="bottom">
          </p-button>
        </div>
        <span class="flex align-items-center mx-1 toolbar-text">of {{maxIndex}}</span>
        </ng-container>
      </ng-container>
    </ng-container>

    <!-- Image actions (special tools) -->
    <ng-container *ngIf="tools.specialTools">
      <span class="toolbar-separator"></span>
      <p-button icon="pi pi-download" size="small" [text]="true"
                pTooltip="Download image as PNG" tooltipPosition="bottom"
                (onClick)="downloadImage.emit()">
      </p-button>
      <p-button *ngIf="isHeatmap" icon="pi pi-window-maximize" size="small" [text]="true"
                pTooltip="Fit to view" tooltipPosition="bottom"
                (onClick)="autoscaleImage.emit()">
      </p-button>
    </ng-container>

    <!-- Zoom tools. Plotly rubber-band drag-zoom: on OpenSeadragon the box-zoom
         covers this and a bare drag pans natively, so it's hidden in image view. -->
    <ng-container *ngIf="isHeatmap && tools.zoomTools">
      <span class="toolbar-separator"></span>
      <p-button *ngIf="!isImageView" icon="pi pi-search" size="small"
                [text]="activeDragMode !== 'zoom'"
                pTooltip="Zoom drag" tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('zoom')">
      </p-button>
      <p-button size="small"
                [text]="activeDragMode !== 'zoomToBox'"
                pTooltip="Zoom box (<kbd>b</kbd>)" [escape]="false" tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('zoomToBox')">
        <img src="assets/plotting/zoom-box.svg"
             [class]="activeDragMode === 'zoomToBox' ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
             style="width: 1rem"/>
      </p-button>
      <p-button icon="pi pi-arrows-alt" size="small"
                [text]="activeDragMode !== 'pan'"
                pTooltip="Pan the image (<kbd>p</kbd>)" [escape]="false" tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('pan')">
      </p-button>
      <p-button icon="pi pi-search-plus" size="small" [text]="true"
                pTooltip="Zoom in (<kbd>+</kbd>)" [escape]="false" tooltipPosition="bottom"
                (onClick)="zoomIn.emit()">
      </p-button>
      <p-button icon="pi pi-search-minus" size="small" [text]="true"
                pTooltip="Zoom out (<kbd>-</kbd>)" [escape]="false" tooltipPosition="bottom"
                (onClick)="zoomOut.emit()">
      </p-button>
    </ng-container>

    <!-- Surface 3D controls -->
    <ng-container *ngIf="!isHeatmap">
      <span class="toolbar-separator"></span>
      <p-button icon="pi pi-search" size="small"
                [text]="activeSurface3dMode !== 'zoom'"
                pTooltip="Zoom" tooltipPosition="bottom"
                (onClick)="toggleSurface3dMode.emit('zoom')">
      </p-button>
      <p-button icon="pi pi-arrows-alt" size="small"
                [text]="activeSurface3dMode !== 'pan'"
                pTooltip="Pan" tooltipPosition="bottom"
                (onClick)="toggleSurface3dMode.emit('pan')">
      </p-button>
      <p-button icon="pi pi-globe" size="small"
                [text]="activeSurface3dMode !== 'orbit'"
                pTooltip="Orbital rotation" tooltipPosition="bottom"
                (onClick)="toggleSurface3dMode.emit('orbit')">
      </p-button>
      <p-button icon="pi pi-sync" size="small"
                [text]="activeSurface3dMode !== 'turntable'"
                pTooltip="Turntable rotation" tooltipPosition="bottom"
                (onClick)="toggleSurface3dMode.emit('turntable')">
      </p-button>
      <p-button icon="pi pi-home" size="small" [text]="true"
                pTooltip="Reset camera to default" tooltipPosition="bottom"
                (onClick)="resetSurfaceCamera.emit()">
      </p-button>
      <!-- 3D coordinate-axes / scale gizmo toggle (napari-js WebGPU volume/isosurface only).
           `p-button-icon-only` gives the same square sizing as the neighbouring pi-icon buttons
           (the projected <img> doesn't trigger PrimeNG's automatic icon-only sizing). -->
      <p-button size="small" *ngIf="isNapariMode" styleClass="p-button-icon-only"
                [text]="!axesVisible"
                pTooltip="Toggle 3D axes / scale" tooltipPosition="bottom"
                (onClick)="toggleAxes.emit()">
        <img src="assets/plotting/3d-coordinates.svg"
             [class]="axesVisible ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
             style="width: 1rem"/>
      </p-button>
      <!-- Surface wireframe toggle (napari-js WebGPU surface only). -->
      <p-button icon="pi pi-share-alt" size="small" *ngIf="isNapariSurfaceMode"
                [text]="!wireframeActive"
                pTooltip="Toggle wireframe" tooltipPosition="bottom"
                (onClick)="toggleWireframe.emit()">
      </p-button>
      <!-- Resolution (decimate factor) for the napari 3D types — reloads at coarser/finer sampling. -->
      <ng-container *ngIf="isNapari3dMode">
        <span class="flex align-items-center mx-1 toolbar-text">Res</span>
        <p-dropdown [options]="decimateOptions" optionLabel="label" optionValue="value"
                    [ngModel]="resolutionScale" appendTo="body"
                    pTooltip="Resolution (decimate factor)" tooltipPosition="bottom"
                    [style]="{'min-width': '6rem'}"
                    (onChange)="selectResolution.emit($event.value)">
        </p-dropdown>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="(isHeatmap || is3dRegions) && tools.regionTools">
      <span class="toolbar-separator"></span>
      <!-- Region Editor: opens the editor as a floating dialog (formerly the
           right-panel Regions tab). Sits with the region drawing tools. -->
      <p-button size="small" [text]="true"
                pTooltip="Open the Region Editor" tooltipPosition="bottom"
                (onClick)="openRegionEditor.emit()">
        <img src="assets/plotting/region-editor.svg" class="toolbar-icon-dark" style="width: 1rem"/>
      </p-button>
      <!-- Region drawing tools -->
      <p-button icon="pi pi-arrow-up-right" size="small"
                [text]="activeDragMode !== 'select'"
                pTooltip="Selection mode (<kbd>s</kbd>)"
                [escape]="false" tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('select')">
      </p-button>
      <p-button icon="pi pi-stop" size="small"
                [text]="activeDragMode !== 'drawrect'"
                pTooltip="Draw a rectangular region (<kbd>r</kbd>)" [escape]="false"
                tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('drawrect')">
      </p-button>
      <p-button *ngIf="!is3dRegions" size="small"
                [text]="activeDragMode !== 'drawopenpath'"
                pTooltip="Draw a polyline (<kbd>l</kbd>)" [escape]="false"
                tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('drawopenpath')">
        <img src="assets/plotting/polyline.svg"
             [class]="activeDragMode === 'drawopenpath' ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
             style="width: 1rem"/>
      </p-button>
      <p-button icon="pi pi-pencil" size="small"
                [text]="activeDragMode !== 'drawclosedpath'"
                pTooltip="Draw a freeform region (<kbd>f</kbd>)" [escape]="false"
                tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('drawclosedpath')">
      </p-button>
      <!-- Brush: paint a region by dragging a disc of the given size; the Size
           slider appears while it's active. Hold Shift to erase (subtract). -->
      <!-- Brush and polyline are absent from a 3D cloud: the brush paints in IMAGE
                 pixels and there is no raster to sample, and an open polyline is a
                 profile tool, not a closed region a selection can test against. -->
            <p-button *ngIf="!is3dRegions" size="small"
                [text]="activeDragMode !== 'brush'"
                pTooltip="Brush: click and drag to paint a region.
                <br>Hold <kbd>Shift</kbd> while painting to erase from a region."
                [escape]="false" tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('brush')">
        <img src="assets/plotting/paintbrush.svg"
             [class]="activeDragMode === 'brush' ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
             style="width: 1rem"/>
      </p-button>
      <ng-container *ngIf="activeDragMode === 'brush'">
        <span class="flex align-items-center mx-1 toolbar-text">Size</span>
        <p-slider [ngModel]="brushSize"
                  [min]="brushSizeMin" [max]="brushSizeMax" [step]="brushSizeStep"
                  (onChange)="brushSizeChange.emit($event.value)"
                  pTooltip="Brush diameter in image pixels."
                  [escape]="false" tooltipPosition="bottom"
                  styleClass="wand-sensitivity-slider"></p-slider>
        <span class="flex align-items-center mx-1 toolbar-text wand-sensitivity-value">
          {{ brushSize }}</span>
      </ng-container>

      <!-- Vertex editing — backends with a vertex-editing overlay (OSD + napari-js image). -->
      <ng-container *ngIf="supportsRegionVertexTools">
        <p-button size="small"
                  [text]="activeDragMode !== 'drawpolygon'"
                  pTooltip="Polygon: click to place each vertex; click the first point to close"
                  [escape]="false" tooltipPosition="bottom"
                  (onClick)="toggleDragMode.emit('drawpolygon')">
          <img src="assets/plotting/polygon-vertices.svg"
               [class]="activeDragMode === 'drawpolygon' ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
               style="width: 1rem"/>
        </p-button>
        <p-button size="small"
                  [text]="activeDragMode !== 'addpoint'"
                  pTooltip="Add a vertex: click an edge of the selected polygon"
                  [escape]="false" tooltipPosition="bottom"
                  (onClick)="toggleDragMode.emit('addpoint')">
          <img src="assets/plotting/vertex-add.svg"
               [class]="activeDragMode === 'addpoint' ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
               style="width: 1rem"/>
        </p-button>
        <p-button size="small"
                  [text]="activeDragMode !== 'deletepoint'"
                  pTooltip="Delete a vertex: click a vertex of the selected polygon"
                  [escape]="false" tooltipPosition="bottom"
                  (onClick)="toggleDragMode.emit('deletepoint')">
          <img src="assets/plotting/vertex-delete.svg"
               [class]="activeDragMode === 'deletepoint' ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
               style="width: 1rem"/>
        </p-button>
      </ng-container>

      <p-button size="small"
                [text]="activeDragMode !== 'wand'"
                pTooltip="Wand: click and drag to grow a region by similar pixel values (<kbd>w</kbd>).
                <br>Hold <kbd>Shift</kbd> while clicking or dragging on a region to erase pixels from it."
                [escape]="false" tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('wand')">
        <img src="assets/plotting/wand.svg"
             [class]="activeDragMode === 'wand' ? 'toolbar-icon-active' : 'toolbar-icon-dark'"
             style="width: 1rem"/>
      </p-button>
      <ng-container *ngIf="activeDragMode === 'wand'">
        <span class="flex align-items-center mx-1 toolbar-text">Sens.</span>
        <p-slider [ngModel]="wandSensitivity"
                  [min]="wandSensitivityMin" [max]="wandSensitivityMax" [step]="wandSensitivityStep"
                  (onChange)="wandSensitivityChange.emit($event.value)"
                  pTooltip="Higher = stricter (smaller selection); lower = looser.
                  Takes effect from the next click/drag tick."
                  [escape]="false" tooltipPosition="bottom"
                  styleClass="wand-sensitivity-slider"></p-slider>
        <span class="flex align-items-center mx-1 toolbar-text wand-sensitivity-value">
          {{ wandSensitivity.toFixed(1) }}</span>
      </ng-container>
      <p-button icon="pi pi-eraser" size="small"
                [text]="activeDragMode !== 'eraseVertex'"
                pTooltip="Vertex eraser (<kbd>e</kbd>): click or drag to remove polygon vertices inside
                the cursor circle from any region."
                [escape]="false" tooltipPosition="bottom"
                (onClick)="toggleDragMode.emit('eraseVertex')">
      </p-button>
      <ng-container *ngIf="activeDragMode === 'eraseVertex'">
        <span class="flex align-items-center mx-1 toolbar-text">Radius</span>
        <p-slider [ngModel]="vertexEraserRadius"
                  [min]="vertexEraserRadiusMin" [max]="vertexEraserRadiusMax" [step]="vertexEraserRadiusStep"
                  (onChange)="vertexEraserRadiusChange.emit($event.value)"
                  pTooltip="Eraser radius in image pixels.
                  Vertices within this distance of the cursor are removed."
                  [escape]="false" tooltipPosition="bottom"
                  styleClass="wand-sensitivity-slider"></p-slider>
        <span class="flex align-items-center mx-1 toolbar-text wand-sensitivity-value">
          {{ vertexEraserRadius }}</span>
      </ng-container>
      <p-button size="small" [text]="true"
                [disabled]="!canUndo"
                pTooltip="Undo the last region action (<kbd>Ctrl</kbd>+<kbd>Z</kbd>).
                Up to 10 actions can be undone."
                [escape]="false" tooltipPosition="bottom"
                (onClick)="undoRegion.emit()">
        <img src="assets/plotting/undo.svg" class="toolbar-icon-dark" style="width: 1rem"/>
      </p-button>
      <p-button size="small" [text]="true"
                [disabled]="!canRedo"
                pTooltip="Redo the last undone region action
                (<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd>)."
                [escape]="false" tooltipPosition="bottom"
                (onClick)="redoRegion.emit()">
        <img src="assets/plotting/redo.svg" class="toolbar-icon-dark" style="width: 1rem"/>
      </p-button>
      <p-button icon="pi pi-trash" size="small" [text]="true"
                pTooltip="Delete selected region (<kbd>Del</kbd>)"
                [escape]="false" tooltipPosition="bottom"
                (onClick)="deleteRegion.emit()">
      </p-button>
      <toolbar-segmentation-tools [activeDragMode]="activeDragMode"
                                  [samModels]="samModels" [samModelId]="samModelId"
                                  [contributedTools]="contributedTools" [toolModelIds]="toolModelIds"
                                  (segmentRegions)="segmentRegions.emit()"
                                  (segmentCellpose)="segmentCellpose.emit()"
                                  (toggleDragMode)="toggleDragMode.emit($event)"
                                  (samModelChange)="samModelChange.emit($event)"
                                  (runTool)="runTool.emit($event)"
                                  (toolModelChange)="toolModelChange.emit($event)"
                                  (openToolParams)="openToolParams.emit($event)">
      </toolbar-segmentation-tools>
    </ng-container>

    <ng-container *ngIf="tools.help">
      <span class="toolbar-separator"></span>

      <!-- Help -->
      <p-button icon="pi pi-question-circle" size="small" [text]="true"
                pTooltip="Help" tooltipPosition="bottom"
                (onClick)="showHelp()">
      </p-button>
    </ng-container>

  </div>
</p-toolbar>
<toolbar-help-dialog [(visible)]="displayHelpDialog"
                     [contributedTools]="contributedTools" [dialogTools]="dialogTools">
</toolbar-help-dialog>
