<!-- The heatmap's rows are a gene LIST, so it needs its own picker: the other
     kinds chart whatever single source the map is coloured by. It behaves as the
     panel's other gene pickers ("Show observations expressing"), from the same model:
     a ticked gene stays in its place in the list, the filter is cleared when the list
     closes, the list reopens on the head of the gene list, and a whole-transcriptome
     dataset's genes are searched (and fetched on first open) the same way. -->
<div class="sx-controls">
  <p-multiSelect
    [options]="geneOptions"
    optionLabel="label"
    optionValue="value"
    [ngModel]="genes"
    (ngModelChange)="genesChange.emit($event ?? [])"
    [filter]="true"
    filterBy="label"
    [resetFilterOnHide]="true"
    (onFilter)="filterChange.emit($event.filter)"
    (onPanelShow)="panelShow.emit()"
    [virtualScroll]="geneOptions.length > geneVirtualScrollFrom"
    [virtualScrollItemSize]="30"
    appendTo="body"
    [showToggleAll]="false"
    [showClear]="true"
    [emptyFilterMessage]="genesAreRemote ? 'No match — keep typing' : 'No match'"
    [emptyMessage]="genesAreRemote ? 'Type to search genes' : 'No genes'"
    [maxSelectedLabels]="3"
    selectedItemsLabel="{0} genes"
    placeholder="Pick genes for the rows"
    pTooltip="One row per gene, averaged within each group"
    tooltipPosition="top"
    styleClass="sx-genes"
  ></p-multiSelect>
  <p-checkbox
    [binary]="true"
    [ngModel]="zScore"
    (onChange)="zScoreChange.emit($event.checked)"
    label="z-score"
    pTooltip="Scale each gene across the groups. Without it one highly-expressed gene saturates the colour scale and the rest reads as blank"
    tooltipPosition="top"
  ></p-checkbox>
</div>
