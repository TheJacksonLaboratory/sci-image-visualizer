<!-- Cell segmentations: how the cells are drawn while the observations are shown as them. Their
     colour is the Observations section's "Colour by", the markers' too. -->
<div class="sc-subhead">Cell segmentations</div>

<!-- 3D: the cells as one surface per cell type, or each its own surface in the colouring. -->
<ng-container *ngIf="is3d">
  <span class="sc-lbl">In 3D</span>
  <p-selectButton
    [options]="cells3dOptions"
    optionLabel="label"
    optionValue="value"
    [ngModel]="view.cells3d"
    (ngModelChange)="onCells3d($event)"
    [allowEmpty]="false"
    styleClass="sc-buttons"
  ></p-selectButton>
  <small class="sc-hint" *ngIf="view.cells3d === 'types'">
    Each cell type is one surface. A type can be shown as its cells in the Region Editor.
  </small>
  <small class="sc-hint" *ngIf="cells3dHint">{{ cells3dHint }}</small>
</ng-container>

<ng-container *ngIf="!is3d && boundarySets.length && boundarySets.length <= 2">
  <span class="sc-lbl">Boundaries</span>
  <div class="sc-row" *ngFor="let set of boundarySets">
    <span class="sc-lbl">{{ set.label }}</span>
    <p-inputSwitch
      [ngModel]="boundaryOn(set.name)"
      (onChange)="onBoundary(set.name, $event.checked)"
      [attr.aria-label]="set.label"
    ></p-inputSwitch>
  </div>
</ng-container>
<ng-container *ngIf="!is3d && boundarySets.length > 2">
  <span class="sc-lbl">Boundaries</span>
  <p-selectButton
    [options]="cellSetOptions"
    optionLabel="label"
    optionValue="value"
    [ngModel]="activeCellSet"
    (ngModelChange)="onCellSet($event)"
    [allowEmpty]="false"
    styleClass="sc-buttons"
  ></p-selectButton>
</ng-container>

<span class="sc-lbl" *ngIf="!is3d">View cells as</span>
<p-selectButton
  *ngIf="!is3d"
  [options]="cellDrawOptions"
  optionLabel="label"
  optionValue="value"
  [ngModel]="view.cellDraw"
  (ngModelChange)="onCellDraw($event)"
  [allowEmpty]="false"
  styleClass="sc-buttons"
></p-selectButton>
<ng-container *ngIf="is3d || view.cellDraw !== 'outline'">
  <span class="sc-lbl">{{ is3d ? 'Cell opacity' : 'Cell fill opacity' }}</span>
  <div class="sc-row sc-row-number">
    <p-slider
      [ngModel]="view.cellOpacity"
      [min]="0.05"
      [max]="1"
      [step]="0.05"
      (onChange)="onCellOpacity($event.value)"
    ></p-slider>
    <p-inputNumber
      [ngModel]="cellOpacityPercent"
      (ngModelChange)="onCellOpacityPercent($event)"
      [min]="5"
      [max]="100"
      [showButtons]="false"
      inputStyleClass="sc-num"
    ></p-inputNumber>
  </div>
</ng-container>
