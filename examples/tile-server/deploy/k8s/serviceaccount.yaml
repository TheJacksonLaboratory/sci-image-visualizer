# Pod identity. Workload Identity is enabled on the dev cluster, so we grant THIS
# KSA's principal read on the COG bucket directly — no intermediary Google service
# account needed. See deploy/README.md for the
# `gcloud storage buckets add-iam-policy-binding`.
#
# No `imagePullSecrets`. It used to carry `ar-pull`, a docker-registry secret
# built from a long-lived service-account key, because the image lived in a
# registry the cluster could not read unaided. The image now comes from one it
# can, so the secret is unnecessary — and leaving the reference here would keep
# it *required to exist*, which is the dependency this change removes.
#
# If you point the image back at a registry the cluster cannot read, restore both
# this field and the secret (deploy/README.md documents it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tile-server
  namespace: jit-tile-example
