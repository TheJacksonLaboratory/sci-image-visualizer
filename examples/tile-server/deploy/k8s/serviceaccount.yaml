# Pod identity. Workload Identity is enabled on jax-cluster-dev-10
# (the cluster's Workload Identity pool), so we grant THIS KSA's principal read
# on the COG bucket directly — no intermediary Google service account needed.
# See deploy/README.md for the `gcloud storage buckets add-iam-policy-binding`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tile-server
  namespace: jit-tile-example
# Durable image pull: a docker-registry secret built from a jax-cloud-image-tools
# SA key with AR read (create it per deploy/README.md; not committed).
imagePullSecrets:
  - name: ar-pull
